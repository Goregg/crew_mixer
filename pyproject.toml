[project]
name = "crew-mixer"
version = "0.1.0"
description = "An open source scheduler for multi day volunteer programms."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
authors = [{ name = "Goregg" }]
dependencies = [
    "ortools>=9.15.6755",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project.scripts]
crew-mixer = "crew_mixer.main:main"

[tool.ruff.lint]
# Enable specific rules for docstring checking
select = [
    "D",    # pydocstyle
    "W",
    "E",
    "F"
]
extend-select = ["D417"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
